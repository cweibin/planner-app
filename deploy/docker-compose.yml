version: "3.9"

services:
  api:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    env_file:
      - ./.env.prod
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    env_file:
      - ./.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
