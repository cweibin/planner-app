server {
    listen 8080;
    listen 8443 ssl;
    server_name myai.yun;

    root /var/www/planner-web;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/myai.yun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myai.yun/privkey.pem;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
